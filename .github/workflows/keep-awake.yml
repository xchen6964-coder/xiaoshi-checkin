name: 保持 Supabase 唤醒

# 免费版 Supabase 在长时间无人访问后会休眠，首次请求要十几秒才回。
# 定时打一次健康检查，让它保持唤醒，避免手机上打开时撞上冷启动。
#
# Supabase Gateway 现在要求 apikey。使用前端本来就公开的 publishable key，
# 从 config.js 运行时读取，避免把键值复制进工作流或新增 GitHub Secret。
on:
  schedule:
    # 每 30 分钟一次。注意：cron 用 UTC，这里不涉及时刻，只关心间隔。
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 请求 auth 健康检查
        run: |
          key=$(node -e "const fs=require('node:fs');const s=fs.readFileSync('config.js','utf8');const m=s.match(/supabaseKey:\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $key" \
            https://mtkuieogemgpdvacphhs.supabase.co/auth/v1/health)
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
