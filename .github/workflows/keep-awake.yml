name: 保持 Supabase 唤醒

# 免费版 Supabase 在长时间无人访问后会休眠，首次请求要十几秒才回。
# 定时打一次健康检查，让它保持唤醒，避免手机上打开时撞上冷启动。
#
# 注意：/auth/v1/health 不需要任何密钥，所以这里刻意不带 apikey。
# 仓库是 public 的，任何 sb_ 开头的键都不该写进工作流文件（2026-11-21 清理过一次）。
on:
  schedule:
    # 每 30 分钟一次。注意：cron 用 UTC，这里不涉及时刻，只关心间隔。
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 请求 auth 健康检查
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://mtkuieogemgpdvacphhs.supabase.co/auth/v1/health)
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
