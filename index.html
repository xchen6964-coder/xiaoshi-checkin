<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小事打卡社区</title>
<meta name="theme-color" content="#F1F4F9">
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot-dot"></div>
      <p>正在打开…</p>
    </div>
  </div>

  <script>
    setTimeout(function () {
      var boot = document.querySelector('.boot');
      if (!boot) return;
      var text = boot.querySelector('p');
      if (text) text.textContent = '加载超过 20 秒，网络响应较慢';
      var button = document.createElement('button');
      button.className = 'btn';
      button.textContent = '重新加载';
      button.addEventListener('click', function () { location.reload(); });
      boot.appendChild(button);
    }, 20000);
  </script>

  <div id="sheet" class="sheet-mask" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="sheet-title">打卡</h3>
        <button class="icon-btn" id="sheet-close" aria-label="关闭">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script defer src="vendor/supabase.js?v=1"></script>
  <script defer src="vendor/cloud-adapter.js?v=3"></script>
  <script defer src="config.js?v=9"></script>
  <script defer src="export.js?v=10"></script>
  <script defer src="app.js?v=48"></script>
</body>
</html>
