<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小事打卡社区</title>
<meta name="theme-color" content="#F1F4F9">
<link rel="stylesheet" href="styles.css?v=27">
</head>
<body>
  <div id="app" class="app">
    <div class="boot">
      <div class="boot-dot"></div>
      <p>正在打开…</p>
    </div>
  </div>

  <div id="sheet" class="sheet-mask" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3 id="sheet-title">打卡</h3>
        <button class="icon-btn" id="sheet-close" aria-label="关闭">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/supabase.js?v=1"></script>
  <script src="vendor/cloud-adapter.js?v=3"></script>
  <script src="config.js?v=9"></script>
  <script src="export.js?v=10"></script>
  <script src="app.js?v=47"></script>
  <script>
    // 兜底：只在脚本真的没下来时提示网络问题；
    // 脚本都到了但还在等服务器，说明是在唤醒，把话说清楚，不要催人重载。
    setTimeout(function () {
      var b = document.querySelector('.boot');
      if (!b) return;
      if (window.SupabaseAdapter && window.APP_CONFIG) {
        var p = b.querySelector('p');
        if (p) p.textContent = '服务器在唤醒，最多再等二十几秒…';
        return;
      }
      b.innerHTML = '<p style="font-size:13px;color:#64748B;margin:0 0 12px">加载超过 20 秒，可能是网络卡住了</p>'
        + '<button onclick="location.reload()" style="height:40px;padding:0 20px;border:none;border-radius:12px;background:#12B5A5;color:#fff;font-size:14px">重新加载</button>';
    }, 20000);
  </script>
</body>
</html>
