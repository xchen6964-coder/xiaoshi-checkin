<svg xmlns="http://www.w3.org/2000/svg" width="900" height="548" viewBox="0 0 900 548" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <rect width="900" height="548" fill="#FFFFFF"/>

  <text x="40" y="46" font-size="22" font-weight="600" fill="#1F2328">GitHub Token 是什么</text>
  <text x="40" y="72" font-size="13" fill="#59636E">它不是「授权」，也不是「登录」，是一串能当密码用的字符串 —— 专门给程序用，给人用的密码它管不着。</text>
  <line x1="40" y1="90" x2="860" y2="90" stroke="#D8DEE4" stroke-width="1"/>

  <!-- 左卡：为什么账号密码不行 -->
  <rect x="40" y="112" width="400" height="176" rx="10" fill="#FFF8F8" stroke="#F0C0C0" stroke-width="1.5"/>
  <text x="62" y="142" font-size="13.5" font-weight="600" fill="#CF222E">✕ 你在网页上登录的方式</text>
  <text x="62" y="172" font-size="12.5" fill="#1F2328">1. 打开 github.com，输账号密码</text>
  <text x="62" y="196" font-size="12.5" fill="#1F2328">2. 浏览器弹一个二次验证码</text>
  <text x="62" y="220" font-size="12.5" fill="#1F2328">3. 你人看着屏幕，输入验证码</text>
  <text x="62" y="252" font-size="12" fill="#8B949E">这套流程的前提是：有个真人 + 有个浏览器窗口</text>
  <text x="62" y="274" font-size="12" fill="#8B949E">而 Git 在后台推代码时，这两样都没有</text>

  <!-- 右卡：为什么需要 token -->
  <rect x="460" y="112" width="400" height="176" rx="10" fill="#F5FBF6" stroke="#A8D5B5" stroke-width="1.5"/>
  <text x="482" y="142" font-size="13.5" font-weight="600" fill="#1A7F37">✓ 所以需要一个替代品</text>
  <text x="482" y="172" font-size="12.5" fill="#1F2328">GitHub 早就不接受账号密码做 git 认证</text>
  <text x="482" y="196" font-size="12.5" fill="#1F2328">取而代之的，就是一串 token</text>
  <text x="482" y="228" font-size="12" fill="#59636E">它的作用：填在「密码」这一栏里</text>
  <text x="482" y="250" font-size="12" fill="#59636E">但它能单独撤销，不会连累你的账号密码</text>
  <text x="482" y="272" font-size="12" fill="#59636E">还能限权限、限时间，泄漏了损失可控</text>

  <!-- 三步 -->
  <text x="40" y="326" font-size="13" font-weight="600" fill="#59636E">那串 ghp_ 开头的字符，走完这三步就完事</text>

  <!-- 步骤 1 -->
  <rect x="40" y="344" width="250" height="112" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.5"/>
  <circle cx="62" cy="368" r="11" fill="#1F2328"/>
  <text x="62" y="372.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="82" y="373" font-size="13" font-weight="600" fill="#1F2328">在 GitHub 网页生成</text>
  <text x="62" y="402" font-size="12" fill="#59636E">点一下 Generate，得到一串</text>
  <text x="62" y="424" font-size="12" fill="#59636E">ghp_xxxxxxxxxxxxxxxx</text>
  <text x="62" y="446" font-size="11.5" fill="#8B949E">只显示这一次，关掉就没了</text>

  <line x1="294" y1="400" x2="314" y2="400" stroke="#8B949E" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 步骤 2 -->
  <rect x="325" y="344" width="250" height="112" rx="8" fill="#FFFFFF" stroke="#D8DEE4" stroke-width="1.5"/>
  <circle cx="347" cy="368" r="11" fill="#1F2328"/>
  <text x="347" y="372.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="367" y="373" font-size="13" font-weight="600" fill="#1F2328">粘进那条命令</text>
  <text x="347" y="402" font-size="12" fill="#59636E">就是 password= 后面那截</text>
  <text x="347" y="424" font-size="12" fill="#59636E">存进 Windows 凭据管理器</text>
  <text x="347" y="446" font-size="11.5" fill="#8B949E">本地加密存放，不进代码仓库</text>

  <line x1="579" y1="400" x2="599" y2="400" stroke="#8B949E" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- 步骤 3 -->
  <rect x="610" y="344" width="250" height="112" rx="8" fill="#FFFFFF" stroke="#A8D5B5" stroke-width="1.5"/>
  <circle cx="632" cy="368" r="11" fill="#1A7F37"/>
  <text x="632" y="372.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="652" y="373" font-size="13" font-weight="600" fill="#1F2328">以后 git push 时自动用</text>
  <text x="632" y="402" font-size="12" fill="#59636E">git 自己取出这串字符</text>
  <text x="632" y="424" font-size="12" fill="#59636E">替你回答问题，不再打断你</text>
  <text x="632" y="446" font-size="11.5" fill="#8B949E">你只要跑一次第 2 步</text>

  <!-- 底部 -->
  <rect x="40" y="480" width="820" height="44" rx="8" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1"/>
  <text x="62" y="507" font-size="12.5" fill="#1F2328">名字拆开看：<tspan font-weight="600">ghp</tspan> = GitHub Personal（classic 型令牌），前面的字母只是标识类型，后面那串才是真正的密码。</text>

  <text x="40" y="540" font-size="11" fill="#8B949E">安全提示：这串字符等价于你账号在该权限范围内的密码，别贴在聊天里、别提交进代码库。</text>
</svg>
