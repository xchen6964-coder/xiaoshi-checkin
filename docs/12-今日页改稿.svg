  <rect x="536" y="112" width="644" height="196" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="560" y="146" font-size="15" font-weight="700" fill="#0F172A">① hero：把今天的缺口说清楚</text>
  <text x="560" y="180" font-size="12.5" fill="#334155">圆环口径不动，仍是你自己的完成度（2/3 已打卡）。</text>
  <text x="560" y="206" font-size="12.5" fill="#334155">大字从「6 人在组」改成「还差 2 人交齐」——在组人数不是今天的进度。</text>
  <text x="560" y="232" font-size="12.5" fill="#334155">新增「+1 较昨日」与「看谁还没交 ›」。</text>
  <text x="560" y="262" font-size="11.5" fill="#94A3B8">代价：昨日对比要读一次昨天全组打卡数，多一次查询；查不到就不显示这个 chip。</text>
  <text x="560" y="286" font-size="11.5" fill="#94A3B8">改的地方：renderToday 的 hero 段 + 一条按昨天的计数。</text>

  <rect x="536" y="326" width="644" height="196" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="560" y="360" font-size="15" font-weight="700" fill="#0F172A">② 任务行：加成员点阵</text>
  <text x="560" y="394" font-size="12.5" fill="#334155">一人一点，青绿=已交，灰=未交，点下写 4/6 人。一眼看出「几个人交了」而不只是数字。</text>
  <text x="560" y="420" font-size="12.5" fill="#334155">人数超过 8 个时自动退回纯数字——点阵放不下，不硬挤。</text>
  <text x="560" y="446" font-size="12.5" fill="#334155">勾选圆钮位置不动，点阵放在勾钮左边。</text>
  <text x="560" y="476" font-size="11.5" fill="#94A3B8">数据现成：每条任务已有打卡人数与成员数，不需要新查询。</text>
  <text x="560" y="500" font-size="11.5" fill="#94A3B8">改的地方：renderToday 任务循环 + styles.css 加一条 .t-dots。</text>

  <rect x="536" y="540" width="644" height="170" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="560" y="574" font-size="15" font-weight="700" fill="#0F172A">③ 本周柱：加高、标数值</text>
  <text x="560" y="608" font-size="12.5" fill="#334155">柱上限 52 → 70px，柱顶标数量；今天那根用实心青绿，其余已打卡日浅青。</text>
  <text x="560" y="634" font-size="12.5" fill="#334155">零数据日留 4px 灰柱做基线，不再是一片空白。</text>
  <text x="560" y="660" font-size="11.5" fill="#94A3B8">没上 78px 是卡片高度限制：78 会把数值标签压到「全组打卡条数」上。</text>
  <text x="560" y="684" font-size="11.5" fill="#94A3B8">改的地方：renderWeek 的高度公式 + styles.css 的 .week 段。</text>

  <rect x="536" y="728" width="644" height="170" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="560" y="762" font-size="15" font-weight="700" fill="#0F172A">不动的部分</text>
  <text x="560" y="796" font-size="12.5" fill="#334155">配色令牌、三档断点、底部 tab、弹层结构、打卡逻辑，全部不碰。</text>
  <text x="560" y="822" font-size="12.5" fill="#334155">桌面端用同一套组件，只是点阵与数字并排，右栏不动。</text>
  <text x="560" y="852" font-size="11.5" fill="#94A3B8">落代码后会给你 512 / 1080 / 1440 三个宽度的实截图，再问是否发布。</text>

  <text x="560" y="944" font-size="11.5" fill="#94A3B8">改稿 v1 · 2026-11-07 · 只出图，未改代码</text>
