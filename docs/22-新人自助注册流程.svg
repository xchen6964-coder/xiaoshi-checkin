<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
  <defs>
    <pattern id="p-dot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D7E0EC"/>
    </pattern>
  </defs>
  <rect width="1240" height="540" fill="#F1F4F9"/>
  <rect width="1240" height="540" fill="url(#p-dot)" opacity="0.8"/>

  <text x="70" y="50" font-size="25" font-weight="700" fill="#0F172A">能。他们自己注册，你只发一个邀请码</text>
  <text x="70" y="76" font-size="13" fill="#64748B">A 方案里没有「审批」「开号」这一步：任何人填邮箱密码点一次，账号就建好了。你不需要帮任何人建账号。</text>

  <!-- 新人流程 -->
  <rect x="70" y="98" width="700" height="238" rx="14" fill="#FFFFFF" stroke="#8FD9C9" stroke-width="1.6"/>
  <text x="94" y="126" font-size="14" font-weight="700" fill="#0F172A">新人从拿到链接到能打卡，四步</text>

  <rect x="94" y="142" width="152" height="76" rx="10" fill="#F1FBF7" stroke="#BFE7D8"/>
  <text x="106" y="164" font-size="11" fill="#0E9C8E">① 打开链接</text>
  <text x="106" y="186" font-size="12" fill="#0F172A">点你发的网址</text>
  <text x="106" y="204" font-size="11" fill="#64748B">手机浏览器即可</text>

  <rect x="262" y="142" width="152" height="76" rx="10" fill="#F1FBF7" stroke="#BFE7D8"/>
  <text x="274" y="164" font-size="11" fill="#0E9C8E">② 填邮箱密码</text>
  <text x="274" y="186" font-size="12" fill="#0F172A">点「注册 / 登录」</text>
  <text x="274" y="204" font-size="11" fill="#64748B">账号当场建好</text>

  <rect x="430" y="142" width="152" height="76" rx="10" fill="#F1FBF7" stroke="#BFE7D8"/>
  <text x="442" y="164" font-size="11" fill="#0E9C8E">③ 填邀请码</text>
  <text x="442" y="186" font-size="12" fill="#0F172A">＋ 取个昵称</text>
  <text x="442" y="204" font-size="11" fill="#64748B">6 位，进组用</text>

  <rect x="598" y="142" width="148" height="76" rx="10" fill="#F1FBF7" stroke="#BFE7D8"/>
  <text x="610" y="164" font-size="11" fill="#0E9C8E">④ 进组打卡</text>
  <text x="610" y="186" font-size="12" fill="#0F172A">看到今日小事</text>
  <text x="610" y="204" font-size="11" fill="#64748B">和组里其他人</text>

  <text x="94" y="248" font-size="12" fill="#334155">四步都在手机上完成，中间不需要你介入。教师走「教师加入」那一栏，只用教师码。</text>
  <text x="94" y="272" font-size="12" fill="#334155">换手机、清缓存都不要紧 —— 邮箱密码记着就能重新登回来，数据在云上。</text>

  <rect x="94" y="288" width="652" height="34" rx="8" fill="#FFFBF2" stroke="#F0DFC6"/>
  <text x="106" y="310" font-size="11.5" fill="#B45309">唯一要提醒成员的一句：昵称在组里不能重名，进不去就换一个字。</text>

  <!-- 你要做的 -->
  <rect x="790" y="98" width="380" height="238" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="814" y="126" font-size="14" font-weight="700" fill="#0F172A">你唯一的动作</text>

  <rect x="814" y="142" width="332" height="58" rx="10" fill="#F7FBFF" stroke="#CFE3F2"/>
  <text x="826" y="164" font-size="12" font-weight="700" fill="#0F172A">把邀请码发给他</text>
  <text x="826" y="184" font-size="11" fill="#475569">在「管理 → 组设置」里能看到，随时可换新的</text>

  <text x="814" y="226" font-size="12" fill="#334155">以后又来新人：同一个邀请码，照样自助。</text>
  <text x="814" y="248" font-size="12" fill="#334155">要作废旧码：点一次「重新生成」，旧码立刻失效。</text>
  <text x="814" y="270" font-size="12" fill="#334155">有人退组、要踢人：停用那个人即可，不影响别人。</text>

  <text x="814" y="304" font-size="11.5" fill="#94A3B8">换句话说：加人这件事的操作成本是</text>
  <text x="814" y="322" font-size="11.5" fill="#94A3B8">「复制一串 6 位码发过去」，没有别的。</text>

  <!-- 陌生人 -->
  <rect x="70" y="356" width="1100" height="88" rx="14" fill="#FFF7F7" stroke="#F3D6D8"/>
  <text x="94" y="382" font-size="13" font-weight="700" fill="#B42318">那陌生人是不是也能注册？能，但进不来</text>
  <text x="94" y="404" font-size="11.5" fill="#7A2A2A">关掉邮箱确认后，理论上谁都能建一个账号。但没有邀请码就加入不了任何组：查到的组、人、打卡全是空，等于一个空壳账号。</text>
  <text x="94" y="426" font-size="11.5" fill="#7A2A2A">他连你组里有多少人都看不到 —— 所有读取都受行级权限控制，不属于任何组就是零行。要更严的话有两招，见下。</text>

  <rect x="70" y="458" width="540" height="62" rx="12" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="94" y="482" font-size="12" font-weight="700" fill="#0F172A">可选加强 ①：注册时就强制填邀请码</text>
  <text x="94" y="502" font-size="11" fill="#475569">先校验码，再建账号。代价：多一次请求，码错要不要留残号得处理。</text>

  <rect x="630" y="458" width="540" height="62" rx="12" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="654" y="482" font-size="12" font-weight="700" fill="#0F172A">可选加强 ②：保留邮箱确认</text>
  <text x="654" y="502" font-size="11" fill="#B45309">最严，但被「每小时 2 封」卡住，9 个人当天聚不齐。不建议。</text>
</svg>
