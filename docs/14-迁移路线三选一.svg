<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="986" viewBox="0 0 1240 986" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
  <defs>
    <pattern id="p-dot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D7E0EC"/>
    </pattern>
  </defs>
  <rect width="1240" height="986" fill="#F1F4F9"/>
  <rect width="1240" height="986" fill="url(#p-dot)" opacity="0.8"/>

  <text x="70" y="56" font-size="26" font-weight="700" fill="#0F172A">小事打卡 · 迁移路线三选一</text>
  <text x="70" y="84" font-size="13.5" fill="#64748B">2026-11-10 23:30 实测状态 + 三条可行路线。先选路线，再谈动手；本图不含已确定的代码改动。</text>

  <!-- 现状 -->
  <rect x="70" y="106" width="1100" height="96" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="94" y="136" font-size="15" font-weight="700" fill="#0F172A">现状（刚从线上实测，不是转述）</text>
  <circle cx="104" cy="160" r="3.5" fill="#E5484D"/>
  <text x="118" y="165" font-size="12.5" fill="#334155">网页静态部分能开，登录必挂：数据库环境处于 <tspan font-weight="700">res_stopped</tspan>（资源点用尽被停）</text>
  <circle cx="104" cy="184" r="3.5" fill="#E5484D"/>
  <text x="118" y="189" font-size="12.5" fill="#334155">前端那把公开钥匙已被<b>吊销</b>：请求直接返回 <tspan font-family="Consolas,monospace">invalid_client 401</tspan> —— 不是网络问题，是平台把入口关了</text>
  <text x="620" y="136" font-size="12" fill="#94A3B8">本地代码 947c119 · 工作区干净 · 线上与本地逐字节一致</text>

  <!-- 关键发现 -->
  <rect x="70" y="222" width="1100" height="112" rx="14" fill="#F7FBFF" stroke="#CFE3F2"/>
  <text x="94" y="252" font-size="15" font-weight="700" fill="#0F172A">关键发现：WorkBuddy 这套云，接口形状就是 Supabase</text>
  <text x="94" y="278" font-size="12.5" fill="#334155">翻 SDK 源码看到的三处证据，决定了下面哪条路线最省力：</text>
  <rect x="94" y="292" width="340" height="30" rx="8" fill="#FFFFFF" stroke="#DDE8F2"/>
  <text x="106" y="312" font-size="11.5" fill="#334155">① 地址 <tspan font-family="Consolas,monospace">/.cloud/database/rest</tspan> → PostgREST</text>
  <rect x="448" y="292" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#DDE8F2"/>
  <text x="460" y="312" font-size="11.5" fill="#334155">② 请求头 <tspan font-family="Consolas,monospace">apikey</tspan> + <tspan font-family="Consolas,monospace">Bearer</tspan></text>
  <rect x="792" y="292" width="354" height="30" rx="8" fill="#FFFFFF" stroke="#DDE8F2"/>
  <text x="804" y="312" font-size="11.5" fill="#334155">③ 写法 <tspan font-family="Consolas,monospace">.from(t).select().eq()</tspan> + <tspan font-family="Consolas,monospace">rpc()</tspan></text>

  <!-- 路线 -->
  <text x="70" y="378" font-size="16" font-weight="700" fill="#0F172A">三条路线</text>

  <!-- A -->
  <rect x="70" y="394" width="352" height="252" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <rect x="70" y="394" width="352" height="4" rx="2" fill="#94A3B8"/>
  <text x="94" y="428" font-size="15" font-weight="700" fill="#0F172A">A · 腾讯云 CloudBase</text>
  <text x="94" y="450" font-size="11.5" fill="#94A3B8">自己的账号，国内节点</text>
  <text x="94" y="480" font-size="12.5" fill="#166534">＋ 国内访问快、备案/域名都省</text>
  <text x="94" y="502" font-size="12.5" fill="#166534">＋ 长期最稳，不依赖境外服务</text>
  <text x="94" y="532" font-size="12.5" fill="#B45309">－ 云函数直连它的 PG，个人版</text>
  <text x="94" y="551" font-size="12.5" fill="#B45309">   根本不通（要标准版 ¥179/月）</text>
  <text x="94" y="571" font-size="12.5" fill="#B45309">－ 走 PG 的 HTTP SDK 则 API 形状</text>
  <text x="94" y="590" font-size="12.5" fill="#B45309">   不同，适配器要重写</text>
  <rect x="94" y="606" width="304" height="26" rx="8" fill="#FEF3E2"/>
  <text x="106" y="624" font-size="11.5" fill="#B45309">工作量：3–5 天，风险最高的一段是登录</text>

  <!-- B -->
  <rect x="444" y="394" width="352" height="252" rx="14" fill="#FFFFFF" stroke="#8FD9C9" stroke-width="1.6"/>
  <rect x="444" y="394" width="352" height="4" rx="2" fill="#0E9C8E"/>
  <text x="468" y="428" font-size="15" font-weight="700" fill="#0F172A">B · Supabase（推荐）</text>
  <text x="468" y="450" font-size="11.5" fill="#0E9C8E">同一套接口，免费额度够用</text>
  <text x="468" y="480" font-size="12.5" fill="#166534">＋ app.js 一行不改：换 SDK 文件</text>
  <text x="468" y="499" font-size="12.5" fill="#166534">   和 config.js 两个值就行</text>
  <text x="468" y="519" font-size="12.5" fill="#166534">＋ RLS、函数、照片存储都是原生的</text>
  <text x="468" y="538" font-size="12.5" fill="#166534">   现有数据库对象能整份搬过去</text>
  <text x="468" y="568" font-size="12.5" fill="#B45309">－ 服务器在境外，国内打开偏慢</text>
  <text x="468" y="587" font-size="12.5" fill="#B45309">－ 免费版 7 天没人用会睡，唤醒慢</text>
  <rect x="468" y="606" width="304" height="26" rx="8" fill="#E7F8F5"/>
  <text x="480" y="624" font-size="11.5" fill="#0E9C8E">工作量：半天到 1 天，主要时间在导数据</text>

  <!-- C -->
  <rect x="818" y="394" width="352" height="252" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <rect x="818" y="394" width="352" height="4" rx="2" fill="#B45309"/>
  <text x="842" y="428" font-size="15" font-weight="700" fill="#0F172A">C · 先买 1 个月顶住</text>
  <text x="842" y="450" font-size="11.5" fill="#94A3B8">不是为了继续用，是为了拿到数据</text>
  <text x="842" y="480" font-size="12.5" fill="#166534">＋ 立刻恢复可用，组里不断档</text>
  <text x="842" y="499" font-size="12.5" fill="#166534">＋ 数据库活了才能把表、函数、</text>
  <text x="842" y="518" font-size="12.5" fill="#166534">   照片整份导出来</text>
  <text x="842" y="548" font-size="12.5" fill="#B45309">－ 单月 ¥99（连包 ¥70/月）</text>
  <text x="842" y="567" font-size="12.5" fill="#B45309">－ 卡片写「每项目 5 人协作」，</text>
  <text x="842" y="586" font-size="12.5" fill="#B45309">   组里 9 人，付款前要问清楚</text>
  <rect x="842" y="606" width="304" height="26" rx="8" fill="#FEF3E2"/>
  <text x="854" y="624" font-size="11.5" fill="#B45309">注意：这是买时间，不是买方案</text>

  <!-- 数据出口 -->
  <rect x="70" y="668" width="1100" height="176" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="94" y="698" font-size="15" font-weight="700" fill="#0F172A">前置卡点：历史数据怎么出来（选哪条路线都绕不过）</text>
  <text x="94" y="722" font-size="12.5" fill="#64748B">现在数据库是停的，导不出来。四条出口，代价不同：</text>

  <rect x="94" y="736" width="252" height="88" rx="10" fill="#F7FAFF" stroke="#E3EEF8"/>
  <text x="108" y="758" font-size="13" font-weight="700" fill="#0F172A">① 付 ¥99 单月</text>
  <text x="108" y="779" font-size="11.5" fill="#334155">立刻能导，1 天内搞定</text>
  <text x="108" y="798" font-size="11.5" fill="#334155">导完可退订，数据不丢</text>
  <text x="108" y="816" font-size="11" fill="#94A3B8">代价：99 元 · 最快</text>

  <rect x="358" y="736" width="252" height="88" rx="10" fill="#F7FAFF" stroke="#E3EEF8"/>
  <text x="372" y="758" font-size="13" font-weight="700" fill="#0F172A">② 等到 12/07</text>
  <text x="372" y="779" font-size="11.5" fill="#334155">资源点刷新后自动恢复</text>
  <text x="372" y="798" font-size="11.5" fill="#334155">0 元，但要停服 27 天</text>
  <text x="372" y="816" font-size="11" fill="#94A3B8">代价：近一个月不能用</text>

  <rect x="622" y="736" width="252" height="88" rx="10" fill="#F7FAFF" stroke="#E3EEF8"/>
  <text x="636" y="758" font-size="13" font-weight="700" fill="#0F172A">③ 找平台要导出</text>
  <text x="636" y="779" font-size="11.5" fill="#334155">能不能给未知，要问官方</text>
  <text x="636" y="798" font-size="11.5" fill="#334155">我这边无法替你发起</text>
  <text x="636" y="816" font-size="11" fill="#94A3B8">代价：不确定，可能白等</text>

  <rect x="886" y="736" width="260" height="88" rx="10" fill="#FFFBF5" stroke="#F0DFC6"/>
  <text x="900" y="758" font-size="13" font-weight="700" fill="#0F172A">④ 不要历史</text>
  <text x="900" y="779" font-size="11.5" fill="#334155">新库重建，9 人重新加入</text>
  <text x="900" y="798" font-size="11.5" fill="#334155">打卡记录清零，照片丢失</text>
  <text x="900" y="816" font-size="11" fill="#B45309">代价：0 元，丢历史</text>

  <!-- 提醒 -->
  <rect x="70" y="862" width="1100" height="96" rx="14" fill="#FFF7F7" stroke="#F3D6D8"/>
  <text x="94" y="886" font-size="13" font-weight="700" fill="#B42318">两条提醒</text>
  <text x="94" y="910" font-size="12" fill="#7A2A2A">① 这个项目之前把 UI 交给了 Codex（见 AGENTS.md）。迁移只动 config.js 与 vendor/；若 Codex 会话同时在改 app.js，会撞车——开工前请确认它已停。</text>
  <text x="94" y="932" font-size="12" fill="#7A2A2A">② 「云函数连不上 CloudBase 自己的 PG」是星禾项目实测过的结论（个人版没有 VPC 权限），同一账号同样适用，这里不再重复试错。</text>

</svg>
