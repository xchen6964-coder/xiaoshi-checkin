  <circle cx="574" cy="190" r="22" fill="#FFFFFF" stroke="#DDE4EE"/>
  <circle cx="634" cy="190" r="22" fill="#0F172A"/>
  <circle cx="694" cy="190" r="22" fill="#12B5A5"/>
