    <text x="884" y="406" fill="#334155">阿岚</text>
    <rect x="930" y="394" width="40" height="17" rx="8" fill="#E7F8F5"/><text x="950" y="406" font-size="9" fill="#0E9C8E" text-anchor="middle">已打卡</text>
