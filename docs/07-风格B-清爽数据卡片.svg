  <text x="834" y="202" font-size="12" fill="#334155">正文　系统字体 Regular</text>
  <text x="834" y="230" font-size="12" fill="#334155">数字　等宽，进度与倒计时必须对齐</text>
  <text x="834" y="256" font-size="11" fill="#98A6B8">圆角 12–18px，1px 描边 + 极淡投影</text>

