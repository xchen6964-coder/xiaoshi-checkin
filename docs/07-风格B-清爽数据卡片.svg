  <text x="1000" y="428" font-size="10" fill="#98A6B8">或表格</text>
  <text x="1000" y="450" font-size="10" fill="#98A6B8">都能一次</text>
  <text x="1000" y="472" font-size="10" fill="#98A6B8">复制成文本</text>

  <line x1="508" y1="512" x2="1152" y2="512" stroke="#EEF2F7"/>
  <text x="508" y="540" font-size="12" fill="#334155">进度用「圆环 + 每项任务一排状态点」，不看表格也能立刻知道谁缺哪一项。</text>
  <text x="508" y="564" font-size="11" fill="#98A6B8">倒计时超过 2 小时用灰，进入 60 分钟转橙，进入 10 分钟转红并轻微呼吸。</text>

  <rect x="480" y="602" width="700" height="228" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
  <text x="508" y="636" font-size="15" font-weight="700" fill="#0F172A">点击后的反馈</text>
  <circle cx="520" cy="670" r="11" fill="#12B5A5"/>
  <text x="520" y="674" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="542" y="674" font-size="12" fill="#334155">点任务卡：右侧状态点依次点亮（每个 40ms 错开），进度环补一段</text>
  <circle cx="520" cy="706" r="11" fill="#12B5A5"/>
  <text x="520" y="710" font-size="11" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="542" y="710" font-size="12" fill="#334155">按钮按下：缩到 0.97 再回弹，背景压深一档，150ms</text>
  <circle cx="520" cy="742" r="11" fill="#12B5A5"/>
  <text x="520" y="746" font-size="11" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="542" y="746" font-size="12" fill="#334155">数字变化：千分位滚动 300ms；4/6 → 5/6 时圆环跟着走</text>
  <circle cx="520" cy="778" r="11" fill="#12B5A5"/>
  <text x="520" y="782" font-size="11" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="542" y="782" font-size="12" fill="#334155">一键提醒：按钮转 loading 800ms，成功后顶部浮出绿色 toast</text>
  <text x="508" y="812" font-size="11" fill="#98A6B8">不做全屏动画、不做彩带撒花，保持工具感</text>
