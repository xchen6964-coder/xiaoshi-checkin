<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
  <defs>
    <pattern id="b-dot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D7E0EC"/>
    </pattern>
    <pattern id="b-photo" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
