    <rect x="740" y="412" width="14" height="14" rx="3" fill="#BFE9E3"/><rect x="758" y="412" width="14" height="14" rx="3" fill="#12B5A5"/><rect x="776" y="412" width="14" height="14" rx="3" fill="#12B5A5"/><rect x="794" y="412" width="14" height="14" rx="3" fill="#E7EEF7"/><rect x="812" y="412" width="14" height="14" rx="3" fill="#BFE9E3"/>
    <rect x="740" y="430" width="14" height="14" rx="3" fill="#12B5A5"/><rect x="758" y="430" width="14" height="14" rx="3" fill="#E7EEF7"/><rect x="776" y="430" width="14" height="14" rx="3" fill="#BFE9E3"/><rect x="794" y="430" width="14" height="14" rx="3" fill="#BFE9E3"/><rect x="812" y="430" width="14" height="14" rx="3" fill="#12B5A5"/>
