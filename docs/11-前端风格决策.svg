<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1E3A5F" flood-opacity="0.08"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#F7F8FA"/>
  <text x="60" y="54" font-size="25" font-weight="700" fill="#0F172A">前端风格：三个候选，一个组合</text>
  <text x="60" y="82" font-size="13" fill="#64748B">初始只做这三套视觉方向，用户拍板「B 做主界面、C 做打卡墙、A 留作可选皮肤」。下面是当时的取舍与现在的落地。</text>

  <!-- A -->
  <rect x="60" y="110" width="360" height="286" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <circle cx="88" cy="142" r="14" fill="#C89B62"/>
  <text x="88" y="147" font-size="12" fill="#fff" text-anchor="middle">A</text>
  <text x="112" y="147" font-size="15" font-weight="700" fill="#0F172A">纸质手账</text>

  <rect x="80" y="164" width="320" height="118" rx="6" fill="#F6EFE3"/>
  <rect x="80" y="164" width="320" height="118" rx="6" fill="none" stroke="#E4D6BE"/>
  <rect x="150" y="156" width="60" height="16" rx="2" fill="#E8D9BE" opacity="0.9" transform="rotate(-3 180 164)"/>
  <text x="96" y="196" font-size="12" fill="#6B5C43">10 月 12 日　晴</text>
  <line x1="96" y1="208" x2="384" y2="208" stroke="#E0D2BA" stroke-width="1"/>
  <line x1="96" y1="232" x2="384" y2="232" stroke="#E0D2BA" stroke-width="1"/>
  <line x1="96" y1="256" x2="330" y2="256" stroke="#E0D2BA" stroke-width="1"/>
  <text x="96" y="225" font-size="11.5" fill="#7A6A50">今天早起跑了三公里，风有点大</text>
  <text x="96" y="249" font-size="11.5" fill="#7A6A50">读完二十页，记了两行</text>

  <text x="80" y="312" font-size="12" fill="#334155">暖米色纸、胶带、横线、手写感</text>
  <text x="80" y="334" font-size="11.5" fill="#94A3B8">最有温度，但数据不好读</text>
  <text x="80" y="356" font-size="11.5" fill="#B45309">没选做主界面</text>
  <text x="80" y="378" font-size="11" fill="#94A3B8">对应图：docs/06-风格A-纸质手账.svg</text>

  <!-- B -->
  <rect x="440" y="110" width="360" height="286" rx="14" fill="#FFFFFF" stroke="#12B5A5" stroke-width="1.6" filter="url(#sh)"/>
  <circle cx="468" cy="142" r="14" fill="#12B5A5"/>
  <text x="468" y="147" font-size="12" fill="#fff" text-anchor="middle">B</text>
  <text x="492" y="147" font-size="15" font-weight="700" fill="#0F172A">清爽数据卡片</text>
  <rect x="614" y="128" width="52" height="20" rx="10" fill="#E7F8F5"/>
  <text x="640" y="142" font-size="10" fill="#0E9C8E" text-anchor="middle">选中</text>

  <rect x="460" y="164" width="320" height="118" rx="8" fill="#F1F4F9"/>
  <rect x="472" y="176" width="150" height="94" rx="8" fill="#fff" stroke="#E3E9F2"/>
  <circle cx="507" cy="223" r="22" fill="none" stroke="#E6EEF7" stroke-width="6"/>
  <path d="M507 201a22 22 0 0 1 15 38" fill="none" stroke="#12B5A5" stroke-width="6" stroke-linecap="round"/>
  <text x="540" y="216" font-size="13" font-weight="700" fill="#0F172A">3/6</text>
  <text x="540" y="234" font-size="9.5" fill="#94A3B8">已完成</text>
  <rect x="632" y="176" width="136" height="28" rx="7" fill="#fff" stroke="#E3E9F2"/>
  <circle cx="650" cy="190" r="6" fill="#12B5A5"/>
  <text x="664" y="194" font-size="10" fill="#334155">早起 08:30</text>
  <rect x="632" y="212" width="136" height="28" rx="7" fill="#fff" stroke="#E3E9F2"/>
  <circle cx="650" cy="226" r="6" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="664" y="230" font-size="10" fill="#64748B">日精进 23:50</text>
  <rect x="632" y="248" width="136" height="22" rx="6" fill="#F7FAFF" stroke="#E3EEF8"/>
  <text x="644" y="263" font-size="9.5" fill="#64748B">本周 5 / 12 / 18</text>

  <text x="460" y="312" font-size="12" fill="#334155">白卡、薄荷绿、等宽数字、留白</text>
  <text x="460" y="334" font-size="11.5" fill="#94A3B8">信息密度合适，手机上不挤</text>
  <text x="460" y="356" font-size="11.5" fill="#0E9C8E">主界面全部用它</text>
  <text x="460" y="378" font-size="11" fill="#94A3B8">对应图：docs/07-风格B-清爽数据卡片.svg</text>

  <!-- C -->
  <rect x="820" y="110" width="360" height="286" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
  <circle cx="848" cy="142" r="14" fill="#E8B84B"/>
  <text x="848" y="147" font-size="12" fill="#fff" text-anchor="middle">C</text>
  <text x="872" y="147" font-size="15" font-weight="700" fill="#0F172A">便签拼贴墙</text>

  <rect x="840" y="164" width="320" height="118" rx="6" fill="#F4F6FA"/>
  <rect x="852" y="174" width="88" height="74" rx="2" fill="#FFE9A8" transform="rotate(-2 896 211)"/>
  <text x="866" y="196" font-size="9" fill="#5C5232">早起</text>
  <text x="866" y="212" font-size="8.5" fill="#6B6040">风很大，跑到桥头</text>
  <rect x="950" y="180" width="88" height="70" rx="2" fill="#D6E8FF" transform="rotate(1.5 994 215)"/>
  <text x="962" y="202" font-size="9" fill="#2C3E54">日精进</text>
  <rect x="1046" y="172" width="88" height="76" rx="2" fill="#FFD9D2" transform="rotate(-1 1090 210)"/>
  <text x="1058" y="194" font-size="9" fill="#553630">运动</text>
  <rect x="900" y="232" width="88" height="42" rx="2" fill="#DCF0D4" transform="rotate(2 944 253)"/>
  <text x="912" y="252" font-size="9" fill="#33452B">帮同事修电脑</text>

  <text x="840" y="312" font-size="12" fill="#334155">四色便签、轻微旋转、投影</text>
  <text x="840" y="334" font-size="11.5" fill="#94A3B8">内容感强，适合看别人交了什么</text>
  <text x="840" y="356" font-size="11.5" fill="#0E9C8E">只用在打卡墙</text>
  <text x="840" y="378" font-size="11" fill="#94A3B8">对应图：docs/08-风格C-便签拼贴墙.svg</text>

  <!-- 落地映射 -->
  <text x="60" y="436" font-size="15" font-weight="700" fill="#0F172A">最后怎么落地</text>

  <rect x="60" y="454" width="1120" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="480" font-size="11" fill="#94A3B8">区域</text>
  <text x="360" y="480" font-size="11" fill="#94A3B8">用哪套</text>
  <text x="620" y="480" font-size="11" fill="#94A3B8">现在的样子</text>

  <line x1="84" y1="492" x2="1156" y2="492" stroke="#F1F5F9"/>
  <text x="84" y="522" font-size="13" fill="#0F172A">今日 / 进度 / 我的 / 管理 / 报告</text>
  <rect x="360" y="505" width="70" height="22" rx="11" fill="#E7F8F5"/>
  <text x="395" y="520" font-size="11" fill="#0E9C8E" text-anchor="middle">B</text>
  <text x="620" y="522" font-size="12" fill="#475569">白卡 + 绿色进度环 + 三档倒计时</text>

  <line x1="84" y1="538" x2="1156" y2="538" stroke="#F1F5F9"/>
  <text x="84" y="568" font-size="13" fill="#0F172A">打卡墙</text>
  <rect x="360" y="551" width="70" height="22" rx="11" fill="#FFF6DF"/>
  <text x="395" y="566" font-size="11" fill="#8A6318" text-anchor="middle">C</text>
  <text x="620" y="568" font-size="12" fill="#475569">两列瀑布，四色轮换，图上文下，点开看大图</text>

  <line x1="84" y1="584" x2="1156" y2="584" stroke="#F1F5F9"/>
  <text x="84" y="614" font-size="13" fill="#0F172A">外观切换（我的 → 外观）</text>
  <rect x="360" y="597" width="70" height="22" rx="11" fill="#F1F5F9"/>
  <text x="395" y="612" font-size="11" fill="#64748B" text-anchor="middle">A</text>
  <text x="620" y="614" font-size="12" fill="#B45309">没做。styles.css 里只留了一行注释</text>

  <!-- 规则 -->
  <rect x="60" y="650" width="1120" height="106" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="678" font-size="13" font-weight="700" fill="#0F172A">当时定下、别再改的三条</text>
  <text x="84" y="704" font-size="12" fill="#334155">① 倒计时三档：&gt;60 分钟灰，10–60 分钟橙，&lt;10 分钟红并轻微呼吸（2s），不做闪烁。</text>
  <text x="84" y="726" font-size="12" fill="#334155">② 动效一律 120–300ms，ease-out，不做全屏动画、不撒彩带、不做连续弹跳。</text>
  <text x="84" y="748" font-size="12" fill="#334155">③ 数字用等宽字体（tabular-nums），进度与倒计时必须对齐，不能跳位。</text>
</svg>
